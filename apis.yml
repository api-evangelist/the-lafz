name: The Lafz
description: >-
  Lafz is a halal-certified cosmetics and personal-care brand, founded in 2019
  and headquartered in Singapore as part of the Believe PTE FMCG group. It sells
  hair care, skin care, makeup, a caffeine range, deodorants and fragrance made
  without alcohol, parabens or animal by-products. The direct-to-consumer
  storefront at lafz.com runs on Shopify and exposes real agent-facing surfaces:
  a Shopify customer-account OpenID Connect provider, an /llms.txt agent guide,
  and a Universal Commerce Protocol (UCP) shopping MCP server for buyer-approved
  agent-driven checkout. thelafz.com is the corporate "halal compliant
  factories" site. Added to the API Evangelist network as an Accel
  portfolio-graph lead and enriched from its live public surfaces.
